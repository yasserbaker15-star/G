<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محلل النصوص - النسخة الذهبية الكاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        textarea { resize: none; }
        
        /* خلفية ضبابية للعناصر */
        .glass {
            backdrop-filter: blur(12px);
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn { transition: 0.3s; }
        .btn:hover { transform: scale(1.03); filter: brightness(1.1); }
        
        /* --- اللون الموحد لجميع العناصر --- */
        .gold-theme {
            background-color: #D9C563 !important;
            color: black !important;
            font-weight: bold !important;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* تنسيق النصوص داخل الحقول */
        input.gold-theme { color: black !important; }
        input.gold-theme::placeholder { color: rgba(0, 0, 0, 0.5) !important; }

        /* تنسيق القوائم المنسدلة */
        select.gold-theme option {
            background-color: white !important;
            color: black !important;
        }

        /* إخفاء حدود الفوكس الافتراضية */
        .gold-theme:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }
    </style>
</head>

<body class="min-h-screen bg-cover bg-center" style="background-image: url('https://i.postimg.cc/FF6ydVNz/Chat-GPT-Image-8-abryl-2026-11-35-51-m.png');">

<div class="w-full max-w-7xl mx-auto p-6">
    <h1 class="text-4xl font-extrabold mb-8 text-center text-white drop-shadow-lg">
        📋 قسم الجرد + الترقيات (النظام الذهبي الموحد)
    </h1>

    <div class="flex flex-col lg:flex-row gap-6">
        <div class="w-full lg:w-80 glass p-5 rounded-2xl shadow-xl">
            <h2 class="text-white mb-4 font-bold text-center text-lg border-b border-white/20 pb-2">
                ⚙️ أدوات الترقيات
            </h2>

            <div class="flex flex-col gap-3">
                <label class="text-white text-sm">حدد المستوى المطلوب فحصه:</label>
                <select id="levelSelect" class="w-full p-2.5 rounded-lg gold-theme cursor-pointer">
                    <option value="trainee">متدرب ⟵ مستوى 1 (4 نقاط)</option>
                    <option value="1">مستوى 1 ⟵ مستوى 2 (8 نقاط)</option>
                    <option value="2">مستوى 2 ⟵ مستوى 3 (14 نقطة)</option>
                    <option value="3">مستوى 3 ⟵ مستوى 4 (21 نقطة)</option>
                    <option value="4">مستوى 4 ⟵ مستوى 5 (28 نقطة)</option>
                </select>

                <button onclick="filterQualified()" class="btn py-2.5 rounded-lg gold-theme shadow-md">
                    🏆 المستحقين (حسب الشروط)
                </button>

                <hr class="border-white/10 my-1">

                <input id="startCode" type="number" placeholder="🔢 بداية الكود" class="w-full p-2.5 rounded-lg gold-theme">
                
                <button onclick="filterNotQualified()" class="btn py-2.5 rounded-lg gold-theme">
                    ⚡ توزيع ذكي (لغير المستحقين)
                </button>

                <button onclick="filterNotQualifiedOnly()" class="btn py-2.5 rounded-lg gold-theme">
                    ❌ عرض غير المستحقين فقط
                </button>

                <button onclick="reassignCodes()" class="btn py-2.5 rounded-lg gold-theme">
                    🔄 إعادة توزيع الأكواد
                </button>

                <button onclick="resetFields()" class="btn py-2.5 rounded-lg gold-theme mt-2 shadow-lg">
                    🗑️ مسح الكل
                </button>
            </div>
        </div>

        <div class="flex-1">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/2 glass p-4 rounded-2xl shadow-xl">
                    <h2 class="text-white text-center mb-3 font-bold">✍️ إدخال النص الأصلي</h2>
                    <textarea id="inputText" class="w-full h-72 p-3 rounded-lg bg-black/60 text-white border border-white/10" placeholder="الصق السجلات هنا..."></textarea>
                    <button onclick="analyzeText()" class="btn w-full mt-3 py-2.5 rounded-lg gold-theme">تحليل سريع</button>
                </div>

                <div class="w-full md:w-1/2 glass p-4 rounded-2xl shadow-xl">
                    <h2 class="text-white text-center mb-3 font-bold">🧹 النتيجة المستخرجة</h2>
                    <textarea id="cleanedText" class="w-full h-72 p-3 rounded-lg bg-black/60 text-green-400 border border-white/10" readonly></textarea>
                    <button onclick="copyText()" class="btn w-full mt-3 py-2.5 rounded-lg gold-theme">📋 نسخ النتيجة</button>
                </div>
            </div>

            <div class="mt-8 glass p-5 rounded-2xl shadow-xl border border-yellow-400/30">
                <h2 class="text-white text-center mb-3 font-bold text-lg">📋 نموذج إعلان الترقيات الجاهز</h2>
                <button onclick="generatePromotionForm()" class="btn w-full mb-3 py-3 rounded-lg gold-theme shadow-xl">
                    ⚡ توليد نموذج الترقيات للمستحقين
                </button>
                <textarea id="promotionBox" class="w-full h-64 p-3 rounded-lg bg-black/60 text-yellow-100 border border-white/10" readonly></textarea>
                <button onclick="copyPromotion()" class="btn w-full mt-2 py-2.5 rounded-lg gold-theme">📋 نسخ النموذج للإرسال</button>
            </div>
        </div>
    </div>

    <p id="counter" class="text-center text-yellow-400 font-bold mt-4 text-lg drop-shadow-md"></p>
</div>

<script>
// منطق البرمجة الخاص بالفرز والترقيات
function getPromotionLevels() {
    const level = document.getElementById("levelSelect").value;
    const map = { "trainee": ["متدرب", "1"], "1": ["1", "2"], "2": ["2", "3"], "3": ["3", "4"], "4": ["4", "5"] };
    return map[level] || ["?", "?"];
}

function parseLines() {
    const text = document.getElementById('inputText').value;
    const currentLevel = document.getElementById("levelSelect").value;
    const pointsConfig = { "trainee": 4, "1": 8, "2": 14, "3": 21, "4": 28 };
    const requiredPoints = pointsConfig[currentLevel] || 0;
    const seen = new Set();

    return text.split("\n").map(line => {
        if (!line.trim() || line.includes("منصب شاغر")) return null;
        const idMatch = line.match(/<@[^>]+>/);
        const id = idMatch ? idMatch[0] : null;
        if (!id || seen.has(id)) return null;
        seen.add(id);

        const checks = (line.match(/✅/g) || []).length;
        let points = 0;
        const pMatch = line.match(/(?:النقاط\s*[:=]?\s*(\d+))|(?:(\d+)\s*(?:نقطة|نقاط|نقطه))/i);
        if (pMatch) points = parseInt(pMatch[1] || pMatch[2]);
        else {
            const nums = line.replace(/<@[^>]+>/g, '').match(/\d+/g);
            if (nums) points = parseInt(nums[nums.length - 1]);
        }

        return { id, checks, points, qualified: (checks >= 2 && points >= requiredPoints) };
    }).filter(x => x);
}

function analyzeText(){
    const data = parseLines();
    document.getElementById("cleanedText").value = data.map(d => `${d.id} | الصح: ${d.checks} | النقاط: ${d.points}`).join("\n");
}

function filterQualified(){
    const data = parseLines().filter(d => d.qualified);
    document.getElementById("cleanedText").value = data.map(d => `${d.id}`).join("\n");
    document.getElementById("counter").textContent = `✅ المستحقون: ${data.length}`;
}

function filterNotQualifiedOnly(){
    const data = parseLines().filter(d => !d.qualified);
    document.getElementById("cleanedText").value = data.map(d => `${d.id}`).join("\n");
}

function filterNotQualified(){
    let start = parseInt(document.getElementById("startCode").value);
    if (isNaN(start)) { alert("ضع بداية الكود أولاً"); return; }
    const data = parseLines().filter(d => !d.qualified);
    document.getElementById("cleanedText").value = data.map((d, i) => `${d.id} G-${start + i}`).join("\n");
}

function reassignCodes(){
    const data = parseLines().filter(d => d.qualified);
    document.getElementById("cleanedText").value = data.map((d,i) => `${d.id} G-${400+i}`).join("\n");
}

function generatePromotionForm() {
    const data = parseLines().filter(d => d.qualified);
    const levels = getPromotionLevels();
    if (data.length === 0) {
        document.getElementById("promotionBox").value = "⚠️ لا يوجد مستحقين حالياً.";
        return;
    }
    document.getElementById("promotionBox").value = `*** ▬▬▬ ﷽ ▬▬▬\n\`\`\`diff\n- الموضوع: ترقيات مستوى (${levels[0]}) .\n\`\`\`\n\`\`\`cs\n# بعد الاطلاع على نظام الترقيات واحصائيات السجلات\n\`\`\`\n\`\`\`\nأولا: ترقية التاليه أسمائهم من مستوى (${levels[0]}) الى مستوى (${levels[1]})\n\`\`\`\n${data.map(d => d.id).join("\n")}`;
    document.getElementById("counter").textContent = `📋 تم التوليد لـ ${data.length}`;
}

function copyText(){ navigator.clipboard.writeText(document.getElementById("cleanedText").value); alert("تم النسخ!"); }
function copyPromotion(){ navigator.clipboard.writeText(document.getElementById("promotionBox").value); alert("تم نسخ النموذج!"); }
function resetFields(){
    document.getElementById("inputText").value = "";
    document.getElementById("cleanedText").value = "";
    document.getElementById("promotionBox").value = "";
    document.getElementById("counter").textContent = "";
    document.getElementById("startCode").value = "";
}
</script>
</body>
</html>
